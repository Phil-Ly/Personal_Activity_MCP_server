# Copy this file outside the repository or to a local ignored path.
# Calendar and Reminder sources grant access only to the configured allowlists.
# Local activity files are read by the Agent and are not configured in this server.

# Optional. The loader uses this same repository-external path when omitted.
# The sidecar stores local metadata, idempotency records, source references,
# and operation audit rows. It must not store source bodies or LLM summaries.
sidecar_path = "~/Library/Application Support/personal-activity-mcp/personal_activity.sqlite3"
default_timezone = "Asia/Shanghai"
default_activity_log_calendar_id = "Personal Activity Log"

[privacy]
# Sensitive logging is disabled by default. Keep all detail flags false unless
# you deliberately want logs to include private source content.
sensitive_logging_enabled = false
log_calendar_notes = false
log_reminder_notes = false
log_llm_outputs = false

[security]
# v1.0 is local-stdio only. These options document the active safety policy;
# enabling remote, bulk, or delete operations is rejected by the config loader.
allow_remote_transport = false
allow_bulk_operations = false
allow_delete_operations = false
require_confirmation_for_completed_actions = true
require_confirmation_for_confirmed_action_updates = true

[[calendar_sources]]
# In the current macOS backend, calendar_id is the Calendar.app calendar name.
calendar_id = "Personal"
title = "Personal"
allow_write = true

[[calendar_sources]]
calendar_id = "Work"
title = "Work"
allow_write = false

[[calendar_sources]]
# Dedicated target for activity.record_completed_action.
calendar_id = "Personal Activity Log"
title = "Personal Activity Log"
allow_write = true

[[reminder_sources]]
# In the current macOS backend, list_id is the Reminders.app list name.
list_id = "Personal"
title = "Personal"
allow_write = true

[[reminder_sources]]
list_id = "Work"
title = "Work"
allow_write = false
