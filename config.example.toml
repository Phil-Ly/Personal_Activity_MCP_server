# Copy this file outside the repository or to a local ignored path.
# EventKit account Sources grant access only to configured container scopes.
# Local activity files are read by the Agent and are not configured in this server.

# Optional. The loader uses this same repository-external path when omitted.
# The sidecar stores local metadata, idempotency records, source references,
# and operation audit rows. It must not store source bodies or LLM summaries.
sidecar_path = "~/Library/Application Support/pamcp/personal_activity.sqlite3"
default_timezone = "Asia/Shanghai"

[[eventkit_sources]]
# Use the native EKSource.sourceIdentifier, never an account display name.
source_id = "Your EventKit Source ID"
allow_calendar_write = true
default_calendar_source = true
allow_reminder_write = true
default_reminder_source = true
