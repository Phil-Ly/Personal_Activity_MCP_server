[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pamcp"
version = "0.12.0"
description = "Local MCP server for Apple Calendar and Reminders on macOS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Phil-Ly" },
]
keywords = [
    "mcp",
    "apple-calendar",
    "apple-reminders",
    "macos",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS :: MacOS X",
]
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://github.com/Phil-Ly/Personal_Activity_MCP_server"
Repository = "https://github.com/Phil-Ly/Personal_Activity_MCP_server"
Issues = "https://github.com/Phil-Ly/Personal_Activity_MCP_server/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
pamcp = "personal_activity_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_activity_mcp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
